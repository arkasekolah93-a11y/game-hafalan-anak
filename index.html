<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Game Hafalan Anak - 30 Juz</title>
    <style>
        body {
            background-color: #007BFF; /* Biru */
            font-family: 'Arial', sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            text-align: center;
        }
        .container {
            background-color: #FFFFFF; /* Putih */
            padding: 25px;
            border-radius: 20px;
            box-shadow: 0 10px 20px rgba(0,0,0,0.2);
            width: 90%;
            max-width: 450px;
        }
        h1 { color: #0056b3; font-size: 24px; margin-bottom: 15px; }
        
        .controls {
            display: flex;
            flex-direction: column;
            gap: 10px;
            margin-bottom: 20px;
            background: #f8f9fa;
            padding: 15px;
            border-radius: 15px;
        }
        .row-control { display: flex; gap: 10px; align-items: center; justify-content: center;}
        select {
            padding: 8px;
            border-radius: 8px;
            border: 2px solid #FFC107; /* Kuning */
            font-size: 14px;
            font-weight: bold;
            color: #0056b3;
            outline: none;
        }
        label { font-size: 12px; color: #666; font-weight: bold; }
        
        .main-btn {
            background-color: #FFC107;
            border: none;
            border-radius: 50%;
            width: 90px;
            height: 90px;
            font-size: 35px;
            color: #fff;
            cursor: pointer;
            box-shadow: 0 5px 15px rgba(255, 193, 7, 0.4);
            transition: 0.2s;
        }
        .main-btn.playing { background-color: #17a2b8; animation: bounce 1s infinite; }
        .main-btn.listening { background-color: #ff9800; animation: pulse 1s infinite; }

        @keyframes pulse { 0%, 100% { transform: scale(1); } 50% { transform: scale(1.1); } }
        @keyframes bounce { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-10px); } }

        .result-box {
            margin-top: 15px;
            padding: 15px;
            background-color: #f1f8ff;
            border-radius: 10px;
            min-height: 40px;
            font-size: 20px;
            font-weight: bold;
            color: #333;
            direction: rtl;
        }
        .message { margin-top: 10px; font-size: 16px; font-weight: bold; color: #0056b3; }
    </style>
</head>
<body>

    <div class="container">
        <h1>Sambung Ayat Al-Qur'an 🌟</h1>
        
        <div class="controls">
            <select id="qari-select" style="width: 100%;">
                <option value="Muhammad_Thaha_Al-Junayd_128kbps" selected>👦 Thaha Al-Junayd (Anak)</option>
                <option value="Minshawy_Teacher_128kbps">👨‍👧 Minshawi (Guru & Anak)</option>
                <option value="Alafasy_128kbps">👨 Alafasy (Dewasa)</option>
            </select>
            
            <select id="surah-select" style="width: 100%;">
                <option value="">Memuat Surat... ⏳</option>
            </select>

            <div class="row-control">
                <div>
                    <label>Dari Ayat</label><br>
                    <select id="start-ayat"></select>
                </div>
                <div>
                    <label>Sampai Ayat</label><br>
                    <select id="end-ayat"></select>
                </div>
            </div>
        </div>
        
        <button id="main-btn" class="main-btn" disabled>▶️</button>
        <div id="message" class="message">Tunggu...</div>
        <div id="result" class="result-box">...</div>
    </div>

    <script>
        const btn = document.getElementById('main-btn');
        const resultBox = document.getElementById('result');
        const messageBox = document.getElementById('message');
        const qariSelect = document.getElementById('qari-select');
        const surahSelect = document.getElementById('surah-select');
        const startAyat = document.getElementById('start-ayat');
        const endAyat = document.getElementById('end-ayat');

        let surahData = [];
        let currentIdx = 0;

        function normalize(text) {
            return text.replace(/[\u0617-\u061A\u064B-\u0652]/g, '').replace(/[أإآٱ]/g, 'ا').replace(/ى/g, 'ي').replace(/ة/g, 'ه').trim();
        }

        async function fetchSurahs() {
            const res = await fetch('https://api.alquran.cloud/v1/surah');
            const data = await res.json();
            surahSelect.innerHTML = '';
            data.data.forEach(s => {
                let opt = document.createElement('option');
                opt.value = s.number;
                opt.text = `${s.number}. ${s.englishName}`;
                surahSelect.add(opt);
            });
            surahSelect.value = 1;
            loadAyahs(1);
        }

        async function loadAyahs(num) {
            btn.disabled = true;
            const res = await fetch(`https://api.alquran.cloud/v1/surah/${num}/quran-simple-clean`);
            const data = await res.json();
            surahData = data.data.ayahs;
            
            startAyat.innerHTML = '';
            endAyat.innerHTML = '';
            surahData.forEach((a, i) => {
                let optS = new Option(`Ayat ${a.numberInSurah}`, i);
                let optE = new Option(`Ayat ${a.numberInSurah}`, i);
                startAyat.add(optS);
                endAyat.add(optE);
            });
            endAyat.value = surahData.length - 1;
            messageBox.innerHTML = "Siap! Tekan Play ▶️";
            btn.disabled = false;
        }

        fetchSurahs();
        surahSelect.onchange = () => loadAyahs(surahSelect.value);

        const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
        if (SpeechRecognition) {
            const recognition = new SpeechRecognition();
            recognition.lang = 'ar-SA';

            function playSession() {
                if (currentIdx > parseInt(endAyat.value)) {
                    messageBox.innerHTML = "Selesai! ✨";
                    btn.innerHTML = "▶️";
                    btn.className = "main-btn";
                    return;
                }

                // Qari Memutar Ayat
                const qari = qariSelect.value;
                const sNum = String(surahSelect.value).padStart(3, '0');
                const aNum = String(surahData[currentIdx].numberInSurah).padStart(3, '0');
                const audio = new Audio(`https://everyayah.com/data/${qari}/${sNum}${aNum}.mp3`);
                
                audio.play().catch(() => {
                    // Fallback jika Thaha server 1 bermasalah
                    audio.src = `https://mirrors.quranicaudio.com/everyayah/data/${qari}/${sNum}${aNum}.mp3`;
                    audio.play();
                });

                btn.innerHTML = "🔊";
                btn.className = "main-btn playing";
                messageBox.innerHTML = `Qari: Ayat ${surahData[currentIdx].numberInSurah}`;

                audio.onended = () => {
                    if (currentIdx + 1 > parseInt(endAyat.value)) {
                        messageBox.innerHTML = "Alhamdulillah Selesai!";
                        btn.innerHTML = "▶️";
                        btn.className = "main-btn";
                        return;
                    }
                    
                    // Giliran Kamu
                    recognition.start();
                    btn.innerHTML = "🎤";
                    btn.className = "main-btn listening";
                    messageBox.innerHTML = `Sekarang kamu: Ayat ${surahData[currentIdx + 1].numberInSurah}`;
                };
            }

            btn.onclick = () => {
                currentIdx = parseInt(startAyat.value);
                playSession();
            };

            recognition.onresult = (e) => {
                const speech = e.results[0][0].transcript;
                resultBox.innerHTML = speech;
                const target = normalize(surahData[currentIdx + 1].text);
                const input = normalize(speech).split(" ");

                let ok = false;
                for(let k of input) { if(k.length > 2 && target.includes(k)) { ok = true; break; } }

                if (ok) {
                    currentIdx += 2; // Lompat ke ayat Qari berikutnya
                    setTimeout(playSession, 500);
                } else {
                    messageBox.innerHTML = "Kurang pas, coba ulangi ayat tadi ya.";
                    btn.innerHTML = "▶️";
                    btn.className = "main-btn";
                }
            };

            recognition.onerror = () => {
                btn.innerHTML = "▶️";
                btn.className = "main-btn";
                messageBox.innerHTML = "Suara tidak terdengar, coba lagi.";
            };
        }
    </script>
</body>
</html>
