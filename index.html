<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-width=1.0">
    <title>Game Hafalan Anak - 30 Juz</title>
    <style>
        body {
            background-color: #007BFF;
            font-family: 'Comic Sans MS', 'Arial', sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            text-align: center;
        }
        .container {
            background-color: #FFFFFF;
            padding: 25px;
            border-radius: 20px;
            box-shadow: 0 10px 20px rgba(0,0,0,0.2);
            width: 90%;
            max-width: 450px;
        }
        h1 { color: #0056b3; font-size: 24px; margin-bottom: 15px; }
        
        .controls {
            display: flex;
            flex-direction: column;
            gap: 10px;
            margin-bottom: 20px;
            background: #f8f9fa;
            padding: 15px;
            border-radius: 15px;
        }
        .row-control { display: flex; gap: 10px; }
        select {
            flex: 1;
            padding: 8px;
            border-radius: 8px;
            border: 2px solid #FFC107;
            font-size: 14px;
            font-weight: bold;
            color: #0056b3;
            outline: none;
        }
        
        .main-btn {
            background-color: #FFC107;
            border: none;
            border-radius: 50%;
            width: 90px;
            height: 90px;
            font-size: 35px;
            color: #fff;
            cursor: pointer;
            box-shadow: 0 5px 15px rgba(255, 193, 7, 0.4);
            transition: 0.2s;
            margin-top: 10px;
        }
        .main-btn:active { transform: scale(0.9); }
        .main-btn.playing { background-color: #17a2b8; animation: bounce 1s infinite; }
        .main-btn.listening { background-color: #ff9800; animation: pulse 1s infinite; }
        .main-btn:disabled { background-color: #ccc; cursor: not-allowed; box-shadow: none; animation: none;}

        @keyframes pulse { 0%, 100% { transform: scale(1); } 50% { transform: scale(1.1); } }
        @keyframes bounce { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-10px); } }

        .result-box {
            margin-top: 15px;
            padding: 15px;
            background-color: #f1f8ff;
            border-radius: 10px;
            min-height: 40px;
            font-size: 20px;
            font-weight: bold;
            color: #333;
            direction: rtl;
        }
        .message { margin-top: 10px; font-size: 16px; font-weight: bold; color: #0056b3; min-height: 25px; }
    </style>
</head>
<body>

    <div class="container">
        <h1>Sambung Ayat 30 Juz! 🌟</h1>
        
        <div class="controls">
            <select id="qari-select">
                <option value="Muhammad_Thaha_Al-Junayd_128kbps" selected>👦 Suara Anak (Thaha Al-Junayd)</option>
                <option value="Minshawy_Teacher_128kbps">👨‍👧 Guru & Anak (Minshawi)</option>
                <option value="Alafasy_128kbps">👨 Suara Dewasa (Alafasy)</option>
            </select>
            
            <div class="row-control">
                <select id="surah-select">
                    <option value="">Memuat Surat... ⏳</option>
                </select>
                <select id="ayat-select">
                    <option value="0">Ayat 1</option>
                </select>
            </div>
        </div>
        
        <button id="main-btn" class="main-btn" disabled>▶️</button>
        <div id="message" class="message">Tunggu sebentar...</div>
        <div id="result" class="result-box">...</div>
    </div>

    <script>
        const btn = document.getElementById('main-btn');
        const resultBox = document.getElementById('result');
        const messageBox = document.getElementById('message');
        const qariSelect = document.getElementById('qari-select');
        const surahSelect = document.getElementById('surah-select');
        const ayatSelect = document.getElementById('ayat-select');

        let surahData = [];
        let currentAyahIndex = 0;

        function bicara(teks) {
            if ('speechSynthesis' in window) {
                const suara = new SpeechSynthesisUtterance();
                suara.text = teks;
                suara.lang = 'id-ID'; 
                suara.rate = 1.0; 
                suara.pitch = 1.2; 
                window.speechSynthesis.speak(suara);
            }
        }

        // Ambil Daftar 114 Surat
        async function fetchSurahList() {
            try {
                const res = await fetch('https://api.alquran.cloud/v1/surah');
                const data = await res.json();
                
                surahSelect.innerHTML = '';
                data.data.forEach(surah => {
                    let opt = document.createElement('option');
                    opt.value = surah.number;
                    opt.text = `${surah.number}. ${surah.englishName} (${surah.name})`;
                    surahSelect.add(opt);
                });
                
                surahSelect.value = 1; // Default Al-Fatihah
                await loadSurahData(1);
            } catch (err) {
                messageBox.innerHTML = "Gagal memuat surat.";
            }
        }

        // Ambil Ayat (Versi Teks Gundul / Simple Clean) agar cocok dengan tangkapan suara HP
        async function loadSurahData(surahNumber) {
            btn.disabled = true;
            messageBox.innerHTML = "Memuat ayat... ⏳";
            
            try {
                const res = await fetch(`https://api.alquran.cloud/v1/surah/${surahNumber}/quran-simple-clean`);
                const data = await res.json();
                surahData = data.data.ayahs;
                
                ayatSelect.innerHTML = '';
                surahData.forEach((ayah, index) => {
                    let opt = document.createElement('option');
                    opt.value = index;
                    opt.text = `Ayat ${ayah.numberInSurah}`;
                    ayatSelect.add(opt);
                });

                currentAyahIndex = 0;
                ayatSelect.value = 0;
                
                messageBox.innerHTML = "Siap! Tekan Play ▶️";
                btn.disabled = false;
            } catch (error) {
                messageBox.innerHTML = "Gagal memuat teks.";
            }
        }

        function getAudioUrl(qari, surahNum, ayahNumInSurah) {
            let s = String(surahNum).padStart(3, '0');
            let a = String(ayahNumInSurah).padStart(3, '0');
            return `https://everyayah.com/data/${qari}/${s}${a}.mp3`;
        }

        fetchSurahList();

        surahSelect.addEventListener('change', (e) => { loadSurahData(e.target.value); resultBox.innerHTML = "..."; });
        ayatSelect.addEventListener('change', (e) => { 
            currentAyahIndex = parseInt(e.target.value); 
            resultBox.innerHTML = "..."; 
            messageBox.innerHTML = "Siap! Tekan Play ▶️"; 
        });

        const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
        if (SpeechRecognition) {
            const recognition = new SpeechRecognition();
            recognition.lang = 'ar-SA';
            recognition.interimResults = false;

            btn.addEventListener('click', () => {
                window.speechSynthesis.cancel(); 
                if(currentAyahIndex >= surahData.length - 1) {
                    messageBox.innerHTML = "Surat selesai! Pilih surat lain.";
                    bicara("Alhamdulillah, surat selesai! Kamu hebat.");
                    return;
                }

                const audioUrl = getAudioUrl(qariSelect.value, surahSelect.value, surahData[currentAyahIndex].numberInSurah);
                const currentAudio = new Audio(audioUrl);
                currentAudio.play();
                
                btn.innerHTML = "🔊";
                btn.className = "main-btn playing";
                messageBox.innerHTML = "Ssst... Dengarkan dulu 🤫";
                resultBox.innerHTML = "...";

                currentAudio.onended = () => {
                    recognition.start();
                    btn.innerHTML = "🎤";
                    btn.className = "main-btn listening";
                    messageBox.innerHTML = `Lanjutkan Ayat ${surahData[currentAyahIndex + 1].numberInSurah}! 🎤`;
                };
            });

            recognition.onspeechend = () => {
                recognition.stop();
                btn.innerHTML = "▶️";
                btn.className = "main-btn";
            };

            recognition.onresult = (event) => {
                const transcript = event.results[0][0].transcript;
                resultBox.innerHTML = transcript;

                // Teks target murni tanpa harakat (sudah dari API)
                const targetText = surahData[currentAyahIndex + 1].text; 
                
                // Normalisasi ringan (ubah alif bengkok jadi alif tegak)
                const cleanTranscript = transcript.replace(/[أإآٱ]/g, 'ا').replace(/ى/g, 'ي').replace(/ة/g, 'ه').split(" ");
                const cleanTarget = targetText.replace(/[أإآٱ]/g, 'ا').replace(/ى/g, 'ي').replace(/ة/g, 'ه');
                
                let cocok = false;
                
                // Cek apakah ada minimal 1 kata bermakna (lebih dari 2 huruf) yang diucapkan dengan benar
                for(let kata of cleanTranscript) {
                    if(kata.length > 2 && cleanTarget.includes(kata)) {
                        cocok = true; 
                        break;
                    }
                }

                if(cocok) {
                    messageBox.innerHTML = "🎉 Horeee! Lanjut! 🎉";
                    bicara("Hore, pintar sekali! Lanjut yuk."); 
                    currentAyahIndex++; 
                    ayatSelect.value = currentAyahIndex;
                } else {
                    messageBox.innerHTML = "Kurang pas, coba lagi yuk! 💪";
                    bicara("Kurang pas, coba lagi yuk!"); 
                }
            };
        }
    </script>
</body>
</html>
