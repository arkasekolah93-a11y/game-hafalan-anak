<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hafiz Cilik - Game Sambung Ayat</title>
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        :root {
            --primary: #007BFF;
            --secondary: #FFC107;
            --white: #FFFFFF;
            --success: #28a745;
            --bg: #f0f7ff;
        }

        body {
            background-color: var(--primary);
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            overflow: hidden;
        }

        .container {
            background-color: var(--white);
            padding: 20px;
            border-radius: 30px;
            box-shadow: 0 15px 35px rgba(0,0,0,0.3);
            width: 90%;
            max-width: 450px;
            text-align: center;
            position: relative;
        }

        h1 { color: var(--primary); font-size: 22px; margin: 10px 0; }

        .progress-container {
            width: 100%;
            background: #e9ecef;
            border-radius: 10px;
            height: 12px;
            margin-bottom: 20px;
            overflow: hidden;
        }
        #progress-bar {
            width: 0%;
            height: 100%;
            background-color: var(--secondary);
            transition: width 0.5s ease;
        }

        .controls-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
            margin-bottom: 15px;
            background: var(--bg);
            padding: 12px;
            border-radius: 20px;
        }

        select {
            padding: 8px;
            border-radius: 10px;
            border: 2px solid var(--secondary);
            font-size: 13px;
            font-weight: bold;
            color: var(--primary);
            outline: none;
            width: 100%;
        }

        .toggle-container {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 15px;
            padding: 0 10px;
        }

        .switch {
            position: relative;
            display: inline-block;
            width: 45px;
            height: 24px;
        }
        .switch input { opacity: 0; width: 0; height: 0; }
        .slider {
            position: absolute;
            cursor: pointer;
            top: 0; left: 0; right: 0; bottom: 0;
            background-color: #ccc;
            transition: .4s;
            border-radius: 34px;
        }
        .slider:before {
            position: absolute;
            content: "";
            height: 18px; width: 18px;
            left: 3px; bottom: 3px;
            background-color: white;
            transition: .4s;
            border-radius: 50%;
        }
        input:checked + .slider { background-color: var(--primary); }
        input:checked + .slider:before { transform: translateX(21px); }

        .action-area {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 15px;
            margin: 15px 0;
        }

        .btn-round {
            border: none;
            border-radius: 50%;
            cursor: pointer;
            display: flex;
            justify-content: center;
            align-items: center;
            transition: 0.3s;
            color: white;
        }

        .btn-play {
            width: 85px; height: 85px;
            background-color: var(--secondary);
            font-size: 30px;
            box-shadow: 0 5px 15px rgba(255, 193, 7, 0.4);
        }

        .btn-hint { width: 50px; height: 50px; background-color: #6f42c1; font-size: 20px; }
        .btn-pause { width: 50px; height: 50px; background-color: #dc3545; font-size: 20px; }

        .btn-play.playing { background-color: #17a2b8; animation: bounce 1s infinite; }
        .btn-play.listening { background-color: #ff9800; animation: pulse 1s infinite; }

        @keyframes pulse { 0%, 100% { transform: scale(1); } 50% { transform: scale(1.1); } }
        @keyframes bounce { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-5px); } }

        .ayah-display {
            background-color: var(--bg);
            padding: 15px;
            border-radius: 15px;
            min-height: 60px;
            max-height: 180px; 
            overflow-y: auto; 
            display: flex;
            flex-direction: column;
            justify-content: flex-start;
            gap: 10px;
        }

        #arabic-text {
            font-size: 26px;
            font-weight: bold;
            color: #333;
            direction: rtl;
            line-height: 1.8;
            display: none; 
            font-family: 'Amiri', 'Scheherazade New', 'Arial', sans-serif;
        }

        #transcript-text {
            font-size: 18px;
            color: var(--primary);
            font-weight: 500;
            direction: rtl;
            margin-top: auto;
        }

        .message-label { font-weight: bold; margin-top: 10px; color: var(--primary); font-size: 14px; }
        
        button:disabled { background-color: #ccc !important; cursor: not-allowed; animation: none !important; }
    </style>
</head>
<body>

    <div class="container">
        <h1>Hafiz Cilik 🌟</h1>
        
        <div class="progress-container">
            <div id="progress-bar"></div>
        </div>

        <div class="controls-grid">
            <select id="mode-select" style="grid-column: span 2; background-color: #e3f2fd;">
                <option value="full" selected>🎮 Mode: Sambung Ayat Berikutnya</option>
                <option value="half">🧩 Mode: Lengkapi 1 Ayat (Separuh)</option>
            </select>

            <select id="qari-select" style="grid-column: span 2;">
                <option value="ar.abdurrahmaansudais" selected>🕌 As-Sudais (Makkah)</option>
                <option value="ar.alafasy">👨 Alafasy (Dewasa)</option>
            </select>
            <select id="surah-select" style="grid-column: span 2;"><option value="">Memuat Surat... ⏳</option></select>
            <div>
                <label style="font-size: 10px; font-weight: bold;">DARI AYAT</label>
                <select id="start-ayat"></select>
            </div>
            <div>
                <label style="font-size: 10px; font-weight: bold;">SAMPAI AYAT</label>
                <select id="end-ayat"></select>
            </div>
        </div>

        <div class="toggle-container">
            <span style="font-size: 12px; font-weight: bold; color: #666;">LIHAT TULISAN ARAB</span>
            <label class="switch">
                <input type="checkbox" id="text-toggle">
                <span class="slider"></span>
            </label>
        </div>

        <div class="ayah-display">
            <div id="arabic-text">...</div>
            <div id="transcript-text">Siap bermain?</div>
        </div>

        <div id="status-msg" class="message-label">Tunggu sebentar...</div>

        <div class="action-area">
            <button id="btn-pause" class="btn-round btn-pause" title="Jeda" disabled><i class="fas fa-pause"></i></button>
            <button id="btn-main" class="btn-round btn-play" disabled><i class="fas fa-play"></i></button>
            <button id="btn-hint" class="btn-round btn-hint" title="Bantuan" disabled><i class="fas fa-lightbulb"></i></button>
        </div>
    </div>

    <script>
        const btnMain = document.getElementById('btn-main');
        const btnPause = document.getElementById('btn-pause');
        const btnHint = document.getElementById('btn-hint');
        const qariSelect = document.getElementById('qari-select');
        const surahSelect = document.getElementById('surah-select');
        const startAyat = document.getElementById('start-ayat');
        const endAyat = document.getElementById('end-ayat');
        const modeSelect = document.getElementById('mode-select');
        const progressBar = document.getElementById('progress-bar');
        const arabicText = document.getElementById('arabic-text');
        const transcriptText = document.getElementById('transcript-text');
        const textToggle = document.getElementById('text-toggle');
        const statusMsg = document.getElementById('status-msg');

        let surahData = [];
        let currentIdx = 0;
        let targetAyahIdx = 0; 
        let isPaused = false;
        let currentAudio = null;
        let recognition = null;

        const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
        if (SpeechRecognition) {
            recognition = new SpeechRecognition();
            recognition.lang = 'ar-SA';
            recognition.interimResults = false;
        }

        function normalize(text) {
            return text
                .replace(/[\u0610-\u061A\u064B-\u065F\u0670\u06D6-\u06ED]/g, '') 
                .replace(/[أإآٱ]/g, 'ا')
                .replace(/ى/g, 'ي')
                .replace(/ة/g, 'ه')
                .trim();
        }

        function updateProgress() {
            const start = parseInt(startAyat.value);
            const end = parseInt(endAyat.value);
            const total = end - start + 1;
            const current = currentIdx - start;
            const percent = (current / total) * 100;
            progressBar.style.width = `${Math.max(0, Math.min(percent, 100))}%`;
        }

        async function fetchSurahs() {
            try {
                const res = await fetch('https://api.alquran.cloud/v1/surah');
                const data = await res.json();
                surahSelect.innerHTML = '';
                data.data.forEach(s => {
                    let opt = new Option(`${s.number}. ${s.englishName}`, s.number);
                    surahSelect.add(opt);
                });
                surahSelect.value = 1;
                await loadAyahs(1);
            } catch (err) {}
        }

        async function loadAyahs(num) {
            btnMain.disabled = true;
            btnPause.disabled = true;
            btnHint.disabled = true;
            statusMsg.innerHTML = "Memuat ayat... ⏳";
            
            try {
                const res = await fetch(`https://api.alquran.cloud/v1/surah/${num}/quran-uthmani`);
                const data = await res.json();
                surahData = data.data.ayahs;
                
                startAyat.innerHTML = '';
                endAyat.innerHTML = '';
                surahData.forEach((a, i) => {
                    startAyat.add(new Option(`Ayat ${a.numberInSurah}`, i));
                    endAyat.add(new Option(`Ayat ${a.numberInSurah}`, i));
                });
                endAyat.value = surahData.length - 1;
                btnMain.disabled = false;
                btnPause.disabled = false;
                btnHint.disabled = false;
                statusMsg.innerHTML = "Siap! Tekan Play ▶️";
            } catch (err) {}
        }

        function playQari() {
            if (isPaused) return;

            if (currentIdx > parseInt(endAyat.value)) {
                statusMsg.innerHTML = "🎉 Alhamdulillah Selesai!";
                btnMain.innerHTML = '<i class="fas fa-redo"></i>';
                btnMain.className = "btn-round btn-play";
                confetti({ particleCount: 150, spread: 70, origin: { y: 0.6 } });
                return;
            }

            const qari = qariSelect.value;
            const ayahId = surahData[currentIdx].number;
            const audioUrl = `https://cdn.islamic.network/quran/audio/64/${qari}/${ayahId}.mp3`;
            const isHalfMode = modeSelect.value === 'half';
            
            if(currentAudio) {
                currentAudio.pause();
                currentAudio.removeEventListener('timeupdate', checkHalfTime);
            }
            currentAudio = new Audio(audioUrl);
            
            function checkHalfTime() {
                if (currentAudio.currentTime >= currentAudio.duration * 0.55) {
                    currentAudio.pause();
                    currentAudio.removeEventListener('timeupdate', checkHalfTime);
                    targetAyahIdx = currentIdx; 
                    startUserTurn();
                }
            }

            if (isHalfMode) {
                currentAudio.addEventListener('timeupdate', checkHalfTime);
                statusMsg.innerHTML = `Qari membaca separuh Ayat ${surahData[currentIdx].numberInSurah}`;
            } else {
                currentAudio.onended = () => {
                    if (currentIdx >= parseInt(endAyat.value)) {
                        currentIdx++; 
                        updateProgress();
                        playQari(); 
                        return;
                    }
                    targetAyahIdx = currentIdx + 1; 
                    startUserTurn();
                };
                statusMsg.innerHTML = `Qari membaca Ayat ${surahData[currentIdx].numberInSurah}`;
            }

            currentAudio.play();
            btnMain.innerHTML = '<i class="fas fa-volume-up"></i>';
            btnMain.className = "btn-round btn-play playing";
            
            arabicText.innerHTML = surahData[currentIdx].text;
            transcriptText.innerHTML = "...";
        }

        function startUserTurn() {
            if (isPaused) return;
            
            const isHalfMode = modeSelect.value === 'half';
            if (isHalfMode) {
                statusMsg.innerHTML = `Lanjutkan sisa Ayat ${surahData[targetAyahIdx].numberInSurah}!`;
            } else {
                statusMsg.innerHTML = `Giliranmu: Ayat ${surahData[targetAyahIdx].numberInSurah}`;
            }
            
            btnMain.innerHTML = '<i class="fas fa-microphone"></i>';
            btnMain.className = "btn-round btn-play listening";
            
            arabicText.innerHTML = surahData[targetAyahIdx].text;
            
            if (recognition) {
                try { recognition.start(); } catch(e) {}
            }
        }

        btnMain.onclick = () => {
            if (btnMain.innerHTML.includes('redo')) {
                currentIdx = parseInt(startAyat.value);
                isPaused = false;
                playQari();
                return;
            }
            if (btnMain.className.includes('listening')) return; 
            
            currentIdx = parseInt(startAyat.value);
            isPaused = false;
            progressBar.style.width = '0%';
            playQari();
        };

        btnPause.onclick = () => {
            isPaused = !isPaused;
            if (isPaused) {
                if (currentAudio) currentAudio.pause();
                if (recognition) { try { recognition.stop(); } catch(e) {} }
                btnPause.innerHTML = '<i class="fas fa-play"></i>';
                btnPause.style.backgroundColor = "#28a745"; 
                statusMsg.innerHTML = "Permainan di-Pause";
                btnMain.style.animation = "none";
            } else {
                btnPause.innerHTML = '<i class="fas fa-pause"></i>';
                btnPause.style.backgroundColor = "#dc3545";
                btnMain.style.animation = ""; 
                
                if (btnMain.className.includes('playing') && currentAudio) {
                    currentAudio.play();
                    statusMsg.innerHTML = "Lanjut memutar audio...";
                } else if (btnMain.className.includes('listening') && recognition) {
                    try { recognition.start(); } catch(e) {}
                    statusMsg.innerHTML = "Lanjut mendengarkan suaramu...";
                } else {
                    playQari();
                }
            }
        };

        btnHint.onclick = () => {
            if (!btnMain.className.includes('listening')) return;
            
            const qari = qariSelect.value;
            const ayahId = surahData[targetAyahIdx].number;
            const audioUrl = `https://cdn.islamic.network/quran/audio/64/${qari}/${ayahId}.mp3`;
            
            if(recognition) { try { recognition.stop(); } catch(e) {} }
            
            const hintAudio = new Audio(audioUrl);
            hintAudio.play();
            statusMsg.innerHTML = "Bantuan... 💡";
            
            setTimeout(() => {
                hintAudio.pause();
                if(recognition) { try { recognition.start(); } catch(e) {} }
                statusMsg.innerHTML = "Ayo lanjut!";
            }, 2500); 
        };

        textToggle.onchange = (e) => {
            arabicText.style.display = e.target.checked ? "block" : "none";
        };

        surahSelect.onchange = () => loadAyahs(surahSelect.value);

        if (recognition) {
            recognition.onresult = (e) => {
                const speech = e.results[0][0].transcript;
                transcriptText.innerHTML = speech;
                
                // SISTEM "GARIS FINISH": Memaksa anak membaca sampai akhir ayat
                const targetTextRaw = normalize(surahData[targetAyahIdx].text);
                const targetWords = targetTextRaw.split(" ");
                
                // Ambil 4 kata terakhir dari target sebagai "Garis Finish"
                const finishLine = targetWords.slice(-4); 
                const inputWords = normalize(speech).split(" ");

                let ok = false;
                
                // Cek apakah ada ucapan anak yang menembus Garis Finish
                for(let k of inputWords) { 
                    if(k.length > 2 && finishLine.includes(k)) { 
                        ok = true; 
                        break; 
                    } 
                }

                // Fallback khusus jika ayatnya sangat pendek (kurang dari 3 kata)
                if (!ok && targetWords.length <= 3) {
                    for(let k of inputWords) {
                        if(k.length > 2 && targetWords.includes(k)) {
                            ok = true;
                            break;
                        }
                    }
                }

                if (ok) {
                    const isHalfMode = modeSelect.value === 'half';
                    currentIdx += isHalfMode ? 1 : 2;
                    
                    updateProgress();
                    confetti({ particleCount: 40, spread: 50, origin: { y: 0.8 } });
                    setTimeout(playQari, 1200);
                } else {
                    statusMsg.innerHTML = "Hafalannya belum sampai akhir, ulangi lagi yuk!";
                    btnMain.innerHTML = '<i class="fas fa-microphone"></i>';
                }
            };

            recognition.onerror = () => {
                if (!isPaused && btnMain.className.includes('listening')) {
                    statusMsg.innerHTML = "Suara tidak jelas, coba lagi.";
                }
            };
            
            recognition.onend = () => {
                if (!isPaused && btnMain.className.includes('listening')) {
                    try { recognition.start(); } catch(e) {}
                }
            }
        }

        fetchSurahs();
    </script>
</body>
</html>
