<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-width=1.0">
    <title>Game Hafalan Anak - 30 Juz</title>
    <style>
        body {
            background-color: #007BFF;
            font-family: 'Comic Sans MS', 'Arial', sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            text-align: center;
        }

        .container {
            background-color: #FFFFFF;
            padding: 30px;
            border-radius: 20px;
            box-shadow: 0 10px 20px rgba(0,0,0,0.2);
            width: 90%;
            max-width: 450px;
        }

        h1 { color: #0056b3; font-size: 24px; margin-bottom: 5px; }
        
        .controls {
            margin: 15px 0;
            display: flex;
            justify-content: center;
            gap: 10px;
        }

        select {
            padding: 10px;
            border-radius: 10px;
            border: 2px solid #FFC107;
            font-size: 16px;
            font-weight: bold;
            color: #0056b3;
            outline: none;
        }

        .status-ayat {
            font-size: 16px;
            font-weight: bold;
            color: #666;
            margin-bottom: 20px;
        }

        .main-btn {
            background-color: #FFC107;
            border: none;
            border-radius: 50%;
            width: 100px;
            height: 100px;
            font-size: 40px;
            color: #fff;
            cursor: pointer;
            box-shadow: 0 5px 15px rgba(255, 193, 7, 0.4);
            transition: 0.2s;
        }

        .main-btn:active { transform: scale(0.9); }
        .main-btn.playing { background-color: #17a2b8; animation: bounce 1s infinite; }
        .main-btn.listening { background-color: #ff9800; animation: pulse 1s infinite; }
        .main-btn:disabled { background-color: #ccc; cursor: not-allowed; box-shadow: none; animation: none;}

        @keyframes pulse { 0%, 100% { transform: scale(1); } 50% { transform: scale(1.1); } }
        @keyframes bounce { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-10px); } }

        .result-box {
            margin-top: 20px;
            padding: 15px;
            background-color: #f1f8ff;
            border-radius: 10px;
            min-height: 40px;
            font-size: 24px;
            font-weight: bold;
            color: #333;
            direction: rtl;
        }

        .message { margin-top: 15px; font-size: 18px; font-weight: bold; color: #0056b3; min-height: 25px; }
    </style>
</head>
<body>

    <div class="container">
        <h1>Sambung Ayat 30 Juz! 🌟</h1>
        
        <div class="controls">
            <select id="surah-select">
                <option value="114">An-Nas</option>
                <option value="113">Al-Falaq</option>
                <option value="112" selected>Al-Ikhlas</option>
                <option value="111">Al-Lahab</option>
                <option value="1">Al-Fatihah</option>
                <!-- Opsi lainnya bisa ditambahkan otomatis lewat JS nanti -->
            </select>
        </div>

        <div id="status-ayat" class="status-ayat">Ayat 1</div>
        
        <button id="main-btn" class="main-btn">▶️</button>
        <div id="message" class="message">Tekan tombol untuk mulai</div>
        <div id="result" class="result-box">...</div>
    </div>

    <script>
        const btn = document.getElementById('main-btn');
        const resultBox = document.getElementById('result');
        const messageBox = document.getElementById('message');
        const surahSelect = document.getElementById('surah-select');
        const statusAyat = document.getElementById('status-ayat');

        let surahData = [];
        let currentAyahIndex = 0;
        let currentAudio = null;

        // Fungsi memuat data Surat dari API Al-Quran
        async function loadSurah(surahNumber) {
            btn.disabled = true;
            messageBox.innerHTML = "Memuat data... ⏳";
            
            try {
                const response = await fetch(`https://api.alquran.cloud/v1/surah/${surahNumber}/ar.alafasy`);
                const data = await response.json();
                surahData = data.data.ayahs;
                currentAyahIndex = 0;
                
                statusAyat.innerHTML = `Ayat ${currentAyahIndex + 1} dari ${surahData.length}`;
                messageBox.innerHTML = "Siap! Tekan Play ▶️";
                btn.disabled = false;
            } catch (error) {
                messageBox.innerHTML = "Gagal memuat. Cek koneksi internet.";
                messageBox.style.color = "red";
            }
        }

        // Panggil saat pertama kali buka
        loadSurah(surahSelect.value);

        // Saat dropdown surat diganti
        surahSelect.addEventListener('change', (e) => {
            loadSurah(e.target.value);
            resultBox.innerHTML = "...";
        });

        // Setup Voice Recognition
        const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
        if (!SpeechRecognition) {
            messageBox.innerHTML = "Gunakan Google Chrome untuk fitur suara!";
            messageBox.style.color = "red";
        } else {
            const recognition = new SpeechRecognition();
            recognition.lang = 'ar-SA';
            recognition.interimResults = false;

            btn.addEventListener('click', () => {
                if(currentAyahIndex >= surahData.length - 1) {
                    messageBox.innerHTML = "Surat selesai! Pilih surat lain.";
                    return;
                }

                // Putar ayat saat ini
                currentAudio = new Audio(surahData[currentAyahIndex].audio);
                currentAudio.play();
                
                btn.innerHTML = "🔊";
                btn.className = "main-btn playing";
                messageBox.innerHTML = "Ssst... Dengarkan dulu 🤫";
                messageBox.style.color = "#17a2b8";
                resultBox.innerHTML = "...";

                // Saat audio selesai, nyalakan mic untuk menangkap ayat BERIKUTNYA
                currentAudio.onended = () => {
                    recognition.start();
                    btn.innerHTML = "🎤";
                    btn.className = "main-btn listening";
                    messageBox.innerHTML = `Lanjutkan Ayat ${currentAyahIndex + 2}! 🎤`;
                    messageBox.style.color = "#ff9800";
                };
            });

            recognition.onspeechend = () => {
                recognition.stop();
                btn.innerHTML = "▶️";
                btn.className = "main-btn";
            };

            recognition.onresult = (event) => {
                const transcript = event.results[0][0].transcript;
                resultBox.innerHTML = transcript;

                // Teks target yang harus diucapkan anak (Ayat berikutnya)
                const targetText = surahData[currentAyahIndex + 1].text;

                // FUNGSI PEMAAF: Menghapus harakat/tanda baca agar mudah dicocokkan
                const cleanTranscript = transcript.replace(/[\u0617-\u061A\u064B-\u0652]/g, '');
                const cleanTarget = targetText.replace(/[\u0617-\u061A\u064B-\u0652]/g, '');
                
                // Cek apakah ada kecocokan teks
                const kataTranscript = cleanTranscript.split(" ");
                let cocok = false;

                // Jika ada minimal 1 kata bermakna yang mirip, anggap benar
                for(let kata of kataTranscript) {
                    if(kata.length > 2 && cleanTarget.includes(kata)) {
                        cocok = true; break;
                    }
                }

                if(cocok) {
                    messageBox.innerHTML = "🎉 Horeee! Lanjut! 🎉";
                    messageBox.style.color = "#28a745";
                    currentAyahIndex++; // Maju ke ayat berikutnya
                    statusAyat.innerHTML = `Ayat ${currentAyahIndex + 1} dari ${surahData.length}`;
                } else {
                    messageBox.innerHTML = "Kurang pas, kita coba lagi yuk! 💪";
                    messageBox.style.color = "#ff9800";
                }
            };
        }
    </script>
</body>
</html>
